apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-canteen
  namespace: smart-canteen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-canteen
  template:
    metadata:
      labels:
        app: smart-canteen
    spec:
      containers:
        - name: app
          image: smart-canteen:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: smart-canteen-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-canteen-secret
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
