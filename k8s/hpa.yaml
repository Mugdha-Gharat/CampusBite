apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-canteen
  namespace: smart-canteen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-canteen
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
